<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lantern Lane — Spot the Difference</title>
<style>
  :root {
    --ink: #2b2118;
    --paper: #f7ead2;
    --panel: #fff8ea;
    --red: #c0392b;
    --gold: #d9a441;
    --teal: #1f6f6b;
    --green: #3f7d4e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #241a12; }
  body { font-family: Georgia, 'Times New Roman', serif; color: var(--ink); }
  #app { display: flex; flex-direction: column; height: 100vh; background: var(--paper); }
  header {
    display: flex; align-items: center; gap: 18px;
    padding: 8px 20px; background: #8c2f26; color: #fbeed3;
    border-bottom: 4px solid var(--gold); flex: 0 0 auto;
  }
  header h1 { font-size: 22px; margin: 0; letter-spacing: 2px; white-space: nowrap; }
  header h1 span { color: var(--gold); }
  .hud { display: flex; align-items: center; gap: 12px; margin-left: auto; font-size: 16px; }
  .hud span { white-space: nowrap; }
  .hud b { font-size: 19px; }
  .pill {
    background: #fbeed3; color: var(--ink); border-radius: 999px;
    padding: 4px 12px; font-weight: bold; white-space: nowrap;
  }
  .pill.low { background: #e74c3c; color: #fff; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .55; } }
  button {
    font-family: inherit; font-size: 15px; font-weight: bold; cursor: pointer;
    background: var(--gold); color: #241a12; border: 2px solid #a97a1f;
    border-radius: 10px; padding: 6px 14px; white-space: nowrap;
  }
  button:hover { filter: brightness(1.08); }
  button:disabled { opacity: .45; cursor: default; }
  #stage { flex: 1 1 auto; position: relative; min-height: 0; }
  #game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  footer {
    flex: 0 0 auto; text-align: center; font-size: 12px; color: #7a5c3e;
    padding: 3px 0 5px; background: var(--paper);
  }
  footer kbd { background: #e8d5b0; border: 1px solid #c9ab72; border-radius: 4px; padding: 0 4px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🏮 LANTERN LANE <span>· SPOT THE DIFFERENCE</span></h1>
    <div class="hud">
      <span id="hud-level">Level 1 · Night Market</span>
      <span class="pill" id="hud-found">Found 0 / 8</span>
      <span class="pill" id="hud-time">⏱ 2:30</span>
      <span class="pill" id="hud-score">Score <b id="hud-score-num">0</b></span>
      <button id="btn-hint" type="button">💡 Hint (H)</button>
      <button id="btn-sound" type="button" title="Toggle sound (M)">🔊</button>
    </div>
  </header>
  <div id="stage">
    <canvas id="game" aria-label="Lantern Lane spot the difference game: two near-identical pictures side by side, click the differences"></canvas>
    <p id="status" role="status" aria-live="polite"></p>
  </div>
  <footer>
    Click a difference on either picture · <kbd>←→↑↓</kbd> move cursor · <kbd>Enter</kbd> mark · <kbd>H</kbd> hint · <kbd>R</kbd> restart level · <kbd>Esc</kbd> menu
  </footer>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
